name: Test actual-result sources

on:
  workflow_dispatch:            # run by hand only: Actions -> "Test actual-result sources" -> Run workflow

permissions:
  contents: write               # lets the job save actuals_test.json to the repository

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the page reader and a headless browser
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Test each source
        run: python actuals_test.py

      - name: Save actuals_test.json
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add actuals_test.json
          git commit -m "Source test $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git pull --rebase --autostash || true
          git push
