name: Update forward P/E

on:
  schedule:
    - cron: '40 21 * * 1-5'   # weekdays at 21:40 UTC (5:40 PM ET in summer, 4:40 PM in winter)
  workflow_dispatch:           # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  pe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install readers and a headless browser
        run: |
          pip install pypdf openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Fetch forward P/E
        run: python pe.py

      - name: Save pe.json
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add pe.json
          git commit -m "P/E update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
