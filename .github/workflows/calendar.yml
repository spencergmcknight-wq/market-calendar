name: Update economic calendar

on:
  schedule:
    - cron: '17 */3 * * *'        # every 3 hours, at 17 minutes past the hour (UTC)
    - cron: '*/15 12-15 * * 1-5'  # weekdays every 15 minutes, 12:00-15:45 UTC = 8:00-11:45 AM ET in summer (7:00-10:45 AM in winter): actual results soon after each release
  workflow_dispatch:               # adds a "Run workflow" button for manual runs

permissions:
  contents: write                  # lets the job save calendar.json back to the repository

concurrency:
  group: calendar                  # one run at a time; a run that starts while another is going waits its turn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the page reader
        run: pip install beautifulsoup4

      - name: Fetch the calendar and actual results
        run: python fetch.py

      - name: Save calendar.json
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.json
          git commit -m "Calendar update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git pull --rebase --autostash || true
          git push
